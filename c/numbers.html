<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Number Cards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    background: #FFF9F0;
    color: #5C3A21;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { height: 100vh; height: 100dvh; }

  /* ---- Screens ---- */
  .screen { height: 100vh; height: 100dvh; width: 100%; }
  .hidden { display: none !important; }

  /* ---- Intro ---- */
  .center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 2rem; }
  .intro-digits { display: flex; gap: .25rem; margin-bottom: 1.5rem; }
  .intro-digits span { font-size: 4rem; font-weight: 800; }
  h1 { font-size: 2rem; margin-bottom: .75rem; }
  .intro-copy { max-width: 24rem; margin-bottom: 2rem; }
  .intro-copy p { color: #8a7358; font-size: 1rem; margin-bottom: .5rem; line-height: 1.4; }
  .btn {
    border: none; cursor: pointer; color: #fff; font-weight: 700;
    box-shadow: 0 6px 14px rgba(0,0,0,.12); transition: transform .1s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(.95); }
  .btn-start { padding: 1.25rem 3rem; border-radius: 999px; font-size: 1.5rem; background: #2A9D3F; }
  .resume { margin-top: 1rem; font-size: .75rem; color: #b3a288; }

  /* ---- Card (scrollable container) ---- */
  #cardScreen { height: 100vh; height: 100dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .digit-pane {
    height: 100vh; height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: background-color .3s ease;
  }
  #digit {
    line-height: 1; transition: transform .3s ease, opacity .3s ease;
    text-shadow: 0 6px 0 rgba(0,0,0,.06);
  }
  .burst {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: 6rem;
  }
  @keyframes ping { 0% { transform: scale(1); opacity: 1; } 75%,100% { transform: scale(2); opacity: 0; } }
  .ping { animation: ping .7s cubic-bezier(0,0,.2,1); }

  /* ---- Controls (below the fold) ---- */
  .controls {
    min-height: 45vh; padding: 2rem 1.25rem 2.5rem;
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
  }
  .grade-row { display: flex; gap: .75rem; width: 100%; max-width: 28rem; }
  .btn-grade { flex: 1; padding: 1.5rem 0; border-radius: 1.5rem; font-size: 1.125rem; }
  .btn-again { background: #F77F00; }
  .btn-good { background: #2A9D3F; }
  .dots { display: flex; gap: .375rem; }
  .dot { width: .875rem; height: .875rem; border-radius: 999px; border: 2px solid #E6D9C5; }
  .icon-btn {
    width: 3rem; height: 3rem; border-radius: 999px; background: #fff; border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,.1); font-size: 1.25rem; cursor: pointer;
  }
  .hint { text-align: center; font-size: .75rem; color: #b3a288; }

  /* ---- Progress ---- */
  #progressScreen { height: 100vh; height: 100dvh; overflow-y: auto; padding: 1.5rem; }
  #progressScreen h2 { font-size: 1.5rem; margin-bottom: .25rem; }
  .sub { font-size: .875rem; color: #8a7358; margin-bottom: 1rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .cell { background: #fff; border-radius: 1rem; padding: .75rem; box-shadow: 0 4px 10px rgba(0,0,0,.06); display: flex; align-items: center; gap: .75rem; }
  .cell .big { font-size: 2.25rem; font-weight: 800; width: 3rem; text-align: center; }
  .stars { font-size: 1.125rem; letter-spacing: 1px; }
  .stars .off { opacity: .25; }
  .cell .meta { font-size: .75rem; color: #8a7358; }
  .prog-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
  .btn-back { background: #1D7AD9; color: #fff; padding: .625rem 1.25rem; border-radius: 999px; font-size: .875rem; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
  .btn-reset { background: #fff; color: #E63946; padding: .625rem 1.25rem; border-radius: 999px; font-size: .875rem; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

// ---------- Variety pools ----------
var FONTS = [
  "'Arial Black', Arial, sans-serif",
  "Georgia, 'Times New Roman', serif",
  "'Courier New', Courier, monospace",
  "'Comic Sans MS', 'Chalkboard SE', cursive",
  "'Trebuchet MS', Verdana, sans-serif",
  "Impact, 'Arial Narrow', sans-serif",
  "'Palatino Linotype', Palatino, serif",
  "Verdana, Geneva, sans-serif"
];
var INK = ["#E63946","#F77F00","#FFB703","#2A9D3F","#0E9594","#1D7AD9","#7B2FBE","#E0218A","#5C3A21"];
var CARD_BG = ["#FFF3E2","#EAF6FF","#F0FBEA","#FFF0F5","#FFFBE0","#F3EEFF"];

// ---------- Leitner spaced repetition ----------
// 5 boxes. A card in box b waits GAPS[b-1] flips before it's due again.
// Got it -> up a box (longer wait). Practice more -> back to box 1.
var GAPS = [1, 2, 5, 9, 14];
var STORAGE_KEY = "number-cards-leitner-v1";

function freshDeck() {
  var d = [];
  for (var i = 0; i < 10; i++) d.push({ digit: i, box: 1, nextDue: 0, seen: 0, right: 0 });
  return d;
}

function pickNext(cards, reviewCount, lastDigit) {
  var due = cards.filter(function (c) { return c.nextDue <= reviewCount; });
  if (due.length > 1 && lastDigit !== null) {
    var f = due.filter(function (c) { return c.digit !== lastDigit; });
    if (f.length) due = f;
  }
  if (due.length === 0) {
    var sorted = cards.slice()
      .filter(function (c) { return c.digit !== lastDigit || cards.length === 1; })
      .sort(function (a, b) { return a.nextDue - b.nextDue || a.box - b.box; });
    return sorted[0].digit;
  }
  var weights = due.map(function (c) { return 1 / c.box; });
  var total = weights.reduce(function (s, w) { return s + w; }, 0);
  var r = Math.random() * total;
  for (var i = 0; i < due.length; i++) {
    r -= weights[i];
    if (r <= 0) return due[i].digit;
  }
  return due[due.length - 1].digit;
}

function randomStyle(prev) {
  var font, ink;
  do { font = FONTS[Math.floor(Math.random() * FONTS.length)]; } while (prev && font === prev.font);
  do { ink = INK[Math.floor(Math.random() * INK.length)]; } while (prev && ink === prev.ink);
  return {
    font: font,
    ink: ink,
    bg: CARD_BG[Math.floor(Math.random() * CARD_BG.length)],
    scale: 0.72 + Math.random() * 0.28,
    tilt: (Math.random() * 10 - 5).toFixed(1)
  };
}

// ---------- State ----------
var cards, reviewCount, current, style, wiggle = false, wiggleTimer = null;

function load() {
  var saved = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) { /* first visit or storage blocked */ }
  cards = (saved && Array.isArray(saved.cards) && saved.cards.length === 10) ? saved.cards : freshDeck();
  reviewCount = (saved && isFinite(saved.reviewCount)) ? saved.reviewCount : 0;
  current = pickNext(cards, reviewCount, null);
  style = randomStyle(null);
}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards: cards, reviewCount: reviewCount })); }
  catch (e) { /* keep playing in-memory */ }
}

function mastered() { return cards.filter(function (c) { return c.box === 5; }).length; }

// ---------- Rendering ----------
var app = document.getElementById("app");

function renderIntro() {
  var demo = [1, 2, 3].map(function (n, i) {
    return '<span style="color:' + INK[(i * 3 + 1) % INK.length] + ';transform:rotate(' + ((i - 1) * 8) + 'deg);font-family:' + FONTS[i * 2] + '">' + n + '</span>';
  }).join("");
  var resume = reviewCount > 0
    ? '<p class="resume">Picking up where you left off &middot; ' + mastered() + '/10 mastered</p>'
    : "";
  app.innerHTML =
    '<div class="screen center-col">' +
      '<div class="intro-digits" aria-hidden="true">' + demo + '</div>' +
      '<h1>Number Cards</h1>' +
      '<div class="intro-copy">' +
        '<p>One big number fills the screen &mdash; ask her what it is. No sounds, no hints; she does the naming.</p>' +
        '<p>When she answers, <strong>scroll down</strong> to find the two grading buttons &mdash; she can\'t reach them by mashing.</p>' +
        '<p>Numbers she knows return less often; tricky ones come back sooner.</p>' +
      '</div>' +
      '<button class="btn btn-start" id="startBtn">Start</button>' +
      resume +
    '</div>';
  document.getElementById("startBtn").addEventListener("click", renderCard);
}

function digitFontSize(s) {
  return "clamp(" + (200 * s.scale) + "px, " + (94 * s.scale) + "vmin, " + (680 * s.scale) + "px)";
}

function digitTransform(entering) {
  if (entering) return "rotate(" + style.tilt + "deg) scale(0.85)";
  if (wiggle) return "rotate(" + (-style.tilt) + "deg) scale(1.06)";
  return "rotate(" + style.tilt + "deg) scale(1)";
}

function renderCard() {
  var dots = cards.map(function (c) {
    var bg = c.digit === current ? "#1D7AD9" : "rgba(42,157,63," + ((c.box - 1) / 4) + ")";
    return '<div class="dot" title="' + c.digit + ': level ' + c.box + '/5" style="background:' + bg + '"></div>';
  }).join("");

  app.innerHTML =
    '<div id="cardScreen">' +
      '<div class="digit-pane" id="digitPane" style="background:' + style.bg + '">' +
        '<span id="digit" style="font-family:' + style.font + ';color:' + style.ink + ';font-size:' + digitFontSize(style) + '">' + current + '</span>' +
        '<div id="burstHost"></div>' +
      '</div>' +
      '<div class="controls">' +
        '<div class="grade-row">' +
          '<button class="btn btn-grade btn-again" id="againBtn">&#128257; Practice more</button>' +
          '<button class="btn btn-grade btn-good" id="goodBtn">&#11088; She got it!</button>' +
        '</div>' +
        '<div class="dots">' + dots + '</div>' +
        '<button class="icon-btn" id="progBtn" aria-label="Show progress">&#128202;</button>' +
        '<p class="hint">Grading jumps back to the next card automatically</p>' +
      '</div>' +
    '</div>';

  var digitEl = document.getElementById("digit");
  // enter animation
  digitEl.style.opacity = "0";
  digitEl.style.transform = digitTransform(true);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      digitEl.style.opacity = "1";
      digitEl.style.transform = digitTransform(false);
    });
  });

  document.getElementById("digitPane").addEventListener("click", doWiggle);
  document.getElementById("againBtn").addEventListener("click", function () { grade(false); });
  document.getElementById("goodBtn").addEventListener("click", function () { grade(true); });
  document.getElementById("progBtn").addEventListener("click", renderProgress);
}

function doWiggle() {
  var digitEl = document.getElementById("digit");
  if (!digitEl) return;
  if (wiggleTimer) clearTimeout(wiggleTimer);
  wiggle = true;
  digitEl.style.transform = digitTransform(false);
  wiggleTimer = setTimeout(function () {
    wiggle = false;
    if (document.getElementById("digit")) document.getElementById("digit").style.transform = digitTransform(false);
  }, 350);
}

function scrollTop() {
  var sc = document.getElementById("cardScreen");
  if (sc) sc.scrollTo({ top: 0, behavior: "smooth" });
}

var grading = false;
function grade(correct) {
  if (current === null || grading) return;
  grading = true;

  cards = cards.map(function (c) {
    if (c.digit !== current) return c;
    var box = correct ? Math.min(c.box + 1, 5) : 1;
    return {
      digit: c.digit, box: box, nextDue: reviewCount + 1 + GAPS[box - 1],
      seen: c.seen + 1, right: c.right + (correct ? 1 : 0)
    };
  });
  reviewCount += 1;
  persist();

  function advance() {
    var nxt = pickNext(cards, reviewCount, current);
    style = randomStyle(style);
    current = nxt;
    wiggle = false;
    grading = false;
    renderCard();
  }

  if (correct) {
    var host = document.getElementById("burstHost");
    if (host) host.innerHTML = '<div class="burst"><span class="ping">&#127881;</span></div>';
    scrollTop();
    setTimeout(advance, 700);
  } else {
    scrollTop();
    advance();
  }
}

function renderProgress() {
  var grid = cards.map(function (c) {
    var on = "", off = "";
    var s = "";
    for (var i = 0; i < 5; i++) s += (i < c.box) ? "\u2B50" : '<span class="off">\u2B50</span>';
    var meta = "seen " + c.seen + (c.seen > 0 ? " &middot; " + c.right + " right" : "");
    return '<div class="cell">' +
      '<div class="big" style="color:' + INK[c.digit % INK.length] + '">' + c.digit + '</div>' +
      '<div><div class="stars">' + s + '</div><div class="meta">' + meta + '</div></div>' +
      '</div>';
  }).join("");

  app.innerHTML =
    '<div id="progressScreen">' +
      '<h2>Progress</h2>' +
      '<p class="sub">' + mastered() + ' of 10 numbers at the top level &middot; ' + reviewCount + ' cards flipped</p>' +
      '<div class="grid">' + grid + '</div>' +
      '<div class="prog-actions">' +
        '<button class="btn btn-back" id="backBtn">Back to cards</button>' +
        '<button class="btn btn-reset" id="resetBtn">Start over</button>' +
      '</div>' +
    '</div>';

  document.getElementById("backBtn").addEventListener("click", renderCard);
  document.getElementById("resetBtn").addEventListener("click", function () {
    cards = freshDeck();
    reviewCount = 0;
    current = pickNext(cards, 0, null);
    style = randomStyle(style);
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderCard();
  });
}

// ---------- Boot ----------
load();
renderIntro();
</script>
</body>
</html>
